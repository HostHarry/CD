[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cdapc-lab"
version = "0.1.0"
description = "Fresh, auditable CD-APC experiments"
requires-python = ">=3.10"
dependencies = ["torch>=2.2", "PyYAML>=6", "Pillow>=10", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cdapc = "cdapc_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
